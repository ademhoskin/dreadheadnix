name: iso

# Builds the installer ISO, then rehearses the install end to end in a VM.
#
# This is also the only thing that evaluates the NixOS config — there is no Nix
# on the machine this repo is developed on, so CI is where a bad option name or
# a broken import surfaces.
#
# We deliberately do NOT run `nix flake check`: it evaluates every output,
# including the ISOs, duplicating these jobs at roughly the same cost.

on:
  push:
    branches: [ main ]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nixos/**'
      - 'home-manager/**'
      - 'dotfiles/**'
      - 'install.sh'
      - 'scripts/**'
      - '.github/workflows/iso.yml'
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # Two NixOS ISO builds plus their closures do not fit in the default
        # runner's free space alongside the preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto

      - name: Evaluate the laptop configurations
        # Deliberately FIRST, before any ISO build. Evaluation catches wrong
        # option names and dead package attributes in about a minute; building
        # the ISOs takes ten. Runs #3, #6 and #7 each burned a full build before
        # reporting an eval error that this ordering surfaces immediately.
        #
        # Building the ISOs never forces these outputs: neither
        # installation-cd-minimal.nix nor installer.nix imports
        # ./nixos/configuration.nix, and flake outputs are evaluated lazily.
        # drvPath forces full evaluation without building anything.
        run: |
          nix eval --raw .#nixosConfigurations.inspiron.config.system.build.toplevel.drvPath > /dev/null
          nix eval --raw .#nixosConfigurations.inspironTest.config.system.build.toplevel.drvPath > /dev/null

      - name: Build installer ISO
        run: nix build .#nixosConfigurations.installer.config.system.build.isoImage -L

      - name: Build rehearsal ISO
        # Credential policy differs from `installer`, so the rehearsal can reach
        # it over SSH. The closure is almost entirely shared with the build
        # above, which is why this second build is cheap.
        run: |
          nix build .#nixosConfigurations.installerTest.config.system.build.isoImage \
            -L --out-link result-test

      - name: Report sizes
        run: ls -lh result/iso/ result-test/iso/

      - name: Upload installer ISO
        uses: actions/upload-artifact@v4
        with:
          name: dreadheadnix-iso
          path: result/iso/*.iso
          # The ISO is already compressed; re-compressing it wastes minutes.
          compression-level: 0
          retention-days: 14

      - name: Upload rehearsal ISO
        uses: actions/upload-artifact@v4
        with:
          name: dreadheadnix-iso-rehearsal
          path: result-test/iso/*.iso
          compression-level: 0
          retention-days: 3

  install-test:
    runs-on: ubuntu-latest
    needs: build-iso
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dreadheadnix-iso-rehearsal
          path: iso

      - name: Install QEMU, OVMF and sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf sshpass

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Rehearse the install
        run: |
          chmod +x scripts/ci-install-test.sh
          ./scripts/ci-install-test.sh iso/*.iso "$RUNNER_TEMP/rehearsal"

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-logs
          path: ${{ runner.temp }}/rehearsal/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    # Deliberately gated on the rehearsal. This is what makes the download URL
    # trustworthy: an ISO that cannot install is never published, so whatever
    # scripts/flash-usb.sh fetches has already been installed successfully in a
    # VM at least once.
    needs: install-test
    permissions:
      contents: write
    steps:
      # Required even though nothing is built here: `gh release` resolves the
      # repository from the git remote, and with no checkout there is no repo to
      # read, so every gh call dies with "not a git repository".
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dreadheadnix-iso
          path: iso

      - name: Normalise the filename and checksum it
        # The build artifact carries a versioned name; a release asset needs a
        # stable one so the /releases/latest/download/ URL never changes.
        run: |
          cd iso
          mv ./*.iso dreadheadnix.iso
          sha256sum dreadheadnix.iso > dreadheadnix.iso.sha256
          ls -lh

      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest \
                 --title "Latest installer ISO" \
                 --notes "Installer ISO built and rehearsed by CI. Published only after the install rehearsal passed."
          gh release upload latest --clobber iso/dreadheadnix.iso iso/dreadheadnix.iso.sha256
          gh release edit latest --latest
          echo "https://github.com/${{ github.repository }}/releases/latest/download/dreadheadnix.iso"
