# hyprpaper has no variable expansion, so these paths are literal and tied to
# the account name. home-manager installs the wallpaper to exactly this path
# (see the .config/hypr/wallpaper.png entry in home-manager/home.nix), so they
# stay correct as long as that file also lives there.
#
# If the username ever changes, both lines and the home.file entry must change
# together, or Hyprland will start with no wallpaper.
preload = /home/dreadheadcoder/.config/hypr/wallpaper.png
wallpaper = ,/home/dreadheadcoder/.config/hypr/wallpaper.png
