# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jimeh/tmuxifier'

# Hackery red (red-on-black)
set -ga terminal-overrides ',xterm-256color:Tc'

# Status position (Bottom)
set -g status-position bottom

# bg=#150a0a, fg=#e0d6d6
set -g status-style "bg=#150a0a,fg=#e0d6d6"

# Left: [Session Name] — dark red badge
set -g status-left-length 30
set -g status-left "#[fg=#fff5f5,bg=#8a1f1f,bold] [#S] #[default] "

# Right: Pane | User@Host — red badge
set -g status-right-length 100
# The Claude context segment is optional: the script lives outside this repo
# and may not exist on every machine, so keep it out of the status line rather
# than printing a shell error on every refresh.
set -g status-right "#[fg=#e0d6d6,bg=#150a0a] Pane: #P #[fg=#150a0a,bg=#e53935,bold] #(whoami)@#H #{?#{==:#{@claude_context},},,#[fg=#6b5b5b,bg=#150a0a] #{@claude_context} }"
set -g status-interval 2

# Window List
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#6b5b5b,bg=#150a0a] #I:#W#F "
setw -g window-status-current-format "#[fg=#150a0a,bg=#ff3b30,bold] #I:#W#F "

# Pane borders
set -g pane-border-style "fg=#5a2a2a"
set -g pane-active-border-style "fg=#ff3b30"

# Message style
set -g message-style "bg=#ff3b30,fg=#150a0a,bold"

# Enable mouse support
set -g mouse on

# Keybindings
set -g prefix C-a
set -g base-index 1
unbind C-b
bind C-a send-prefix

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
